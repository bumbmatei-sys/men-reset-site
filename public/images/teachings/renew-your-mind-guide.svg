<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Renew your mind: four practical steps</title><desc id="d">A clean dark editorial diagram in four columns with warm gold accents. Notice, Test, Replace, Practice.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e1012"/><stop offset="1" stop-color="#22201b"/></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#e8c88d"/><stop offset="1" stop-color="#9b7641"/></linearGradient></defs><rect width="1280" height="720" fill="url(#bg)"/><path d="M0 94H1280M0 626H1280" stroke="#4e4435" opacity=".45"/><g font-family="Arial,sans-serif"><text x="84" y="68" fill="#c4a777" font-size="16" letter-spacing="4">CALL TO RESET  /  FIELD GUIDE 01</text><text x="84" y="162" fill="#f4efe6" font-size="58" font-weight="700">Renew Your Mind</text><text x="84" y="210" fill="#a9a69f" font-size="25">Four steps. One thought at a time.</text><g transform="translate(84 287)"><rect width="255" height="246" rx="18" fill="#242522" stroke="#675c47"/><circle cx="40" cy="43" r="23" fill="#d2b580"/><text x="40" y="51" font-size="21" font-weight="700" text-anchor="middle" fill="#191a18">01</text><text x="25" y="117" fill="#f4efe6" font-size="31" font-weight="700">Notice</text><text x="25" y="157" fill="#cac6bc" font-size="19">Name the thought.</text><text x="25" y="187" fill="#cac6bc" font-size="19">Do not obey it yet.</text></g><g transform="translate(367 287)"><rect width="255" height="246" rx="18" fill="#242522" stroke="#675c47"/><circle cx="40" cy="43" r="23" fill="#d2b580"/><text x="40" y="51" font-size="21" font-weight="700" text-anchor="middle" fill="#191a18">02</text><text x="25" y="117" fill="#f4efe6" font-size="31" font-weight="700">Test</text><text x="25" y="157" fill="#cac6bc" font-size="19">Compare it with</text><text x="25" y="187" fill="#cac6bc" font-size="19">Scripture in context.</text></g><g transform="translate(650 287)"><rect width="255" height="246" rx="18" fill="#242522" stroke="#675c47"/><circle cx="40" cy="43" r="23" fill="#d2b580"/><text x="40" y="51" font-size="21" font-weight="700" text-anchor="middle" fill="#191a18">03</text><text x="25" y="117" fill="#f4efe6" font-size="31" font-weight="700">Replace</text><text x="25" y="157" fill="#cac6bc" font-size="19">Write one truthful</text><text x="25" y="187" fill="#cac6bc" font-size="19">sentence to return to.</text></g><g transform="translate(933 287)"><rect width="255" height="246" rx="18" fill="#242522" stroke="#675c47"/><circle cx="40" cy="43" r="23" fill="#d2b580"/><text x="40" y="51" font-size="21" font-weight="700" text-anchor="middle" fill="#191a18">04</text><text x="25" y="117" fill="#f4efe6" font-size="31" font-weight="700">Practice</text><text x="25" y="157" fill="#cac6bc" font-size="19">Take one action</text><text x="25" y="187" fill="#cac6bc" font-size="19">that agrees with it.</text></g><text x="84" y="602" fill="#d9c7a6" font-size="22">Romans 12:2</text><text x="1188" y="677" fill="#9e9688" font-size="17" text-anchor="end">calltoreset.site</text></g></svg>